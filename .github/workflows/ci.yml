name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run package
      - run: npm run test:package
      - name: Validate with Antigravity where installed
        shell: bash
        run: |
          if command -v agy >/dev/null 2>&1; then
            agy plugin validate .
            agy plugin validate ./dist/plugin --strict --json
          else
            echo "Antigravity host validation requires agy 1.5.17."
          fi
